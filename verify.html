<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<link
    rel="icon"
    type="image/jpeg"
    href="https://static.vecteezy.com/system/resources/previews/043/623/704/non_2x/engineering-line-circle-icon-design-vector.jpg"
>

<title>Verify Email — Accelerated Engineering Studies</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background: #f5f7fb;
    color: #172033;
}

.card {
    width: min(520px, 100%);
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 15px 40px rgba(0,0,0,.08);
    text-align: center;
}

.icon {
    font-size: 3rem;
    margin-bottom: 15px;
}

h1 {
    margin-bottom: 12px;
}

p {
    color: #667085;
}

.success {
    color: #027a48;
}

.error {
    color: #b42318;
}

a {
    display: inline-block;
    margin-top: 20px;
    padding: 13px 20px;
    border-radius: 10px;
    background: #243b64;
    color: white;
    text-decoration: none;
    font-weight: 700;
}

</style>

</head>

<body>

<div class="card">

<div
    class="icon"
    id="icon"
>
⏳
</div>

<h1 id="title">
Verifying your email...
</h1>

<p id="message">
Please wait while we confirm your email address.
</p>

<a
    id="returnLink"
    href="index.html"
    style="display:none;"
>
Return to the application
</a>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    applyActionCode
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDLLOZp-9G4fm-GqPn8JJ2DtLTXca-C5BY",

    authDomain:
        "engineeringstudieseoi.firebaseapp.com",

    projectId:
        "engineeringstudieseoi",

    storageBucket:
        "engineeringstudieseoi.firebasestorage.app",

    messagingSenderId:
        "692995755223",

    appId:
        "1:692995755223:web:ab00efbc1c3d6f2e74f492"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


const title =
    document.getElementById("title");

const message =
    document.getElementById("message");

const icon =
    document.getElementById("icon");

const returnLink =
    document.getElementById("returnLink");


async function verifyEmail() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const mode =
        params.get("mode");

    const oobCode =
        params.get("oobCode");


    if (
        mode !== "verifyEmail" ||
        !oobCode
    ) {

        icon.textContent = "❌";

        title.textContent =
            "Invalid verification link";

        message.textContent =
            "This verification link is missing or invalid. Please request a new verification email.";

        message.className =
            "error";

        returnLink.style.display =
            "inline-block";

        return;

    }


    try {

        /*
           This is the actual Firebase verification operation.
        */

        await applyActionCode(
            auth,
            oobCode
        );


        icon.textContent =
            "✅";

        title.textContent =
            "Email verified!";

        message.textContent =
            "Your email address has been successfully verified. Your expression of interest has been confirmed.";

        message.className =
            "success";

        returnLink.style.display =
            "inline-block";


    } catch (error) {

        console.error(
            "VERIFICATION ERROR:",
            error
        );


        icon.textContent =
            "❌";

        title.textContent =
            "Verification failed";

        let text =
            "This verification link is invalid or has expired. Please request a new verification email.";

        if (
            error.code ===
            "auth/invalid-action-code"
        ) {

            text =
                "This verification link is invalid or has already been used.";

        }

        message.textContent =
            text;

        message.className =
            "error";

        returnLink.style.display =
            "inline-block";

    }

}


verifyEmail();

</script>

</body>
</html>

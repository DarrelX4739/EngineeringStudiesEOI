<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Verify Email — Accelerated Engineering Studies</title>

<link
    rel="icon"
    href="https://static.vecteezy.com/system/resources/previews/043/623/704/non_2x/engineering-line-circle-icon-design-vector.jpg"
>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: grid;

    place-items: center;

    padding: 20px;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f5f7fb;

    color: #172033;

}

.card {

    width: min(600px, 100%);

    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 20px;

    padding: 40px;

    text-align: center;

    box-shadow:
        0 15px 40px rgba(0,0,0,.08);

}

h1 {

    margin-bottom: 15px;

}

p {

    color: #667085;

    line-height: 1.6;

}

.status {

    margin-top: 25px;

    padding: 15px;

    border-radius: 10px;

}

.success {

    background: #ecfdf3;

    color: #027a48;

}

.error {

    background: #fef3f2;

    color: #b42318;

}

.loading {

    background: #eff6ff;

    color: #1d4ed8;

}

a {

    display: inline-block;

    margin-top: 25px;

    padding: 13px 20px;

    border-radius: 10px;

    background: #243b64;

    color: white;

    text-decoration: none;

    font-weight: 700;

}

</style>

</head>

<body>

<div class="card">

<h1>
Email Verification
</h1>

<p>
We're confirming your email address.
</p>

<div
    id="status"
    class="status loading"
>
Verifying your email...
</div>

<a
    id="homeLink"
    href="index.html"
    style="display:none;"
>
Return to the website
</a>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    applyActionCode,
    onAuthStateChanged,
    reload
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    updateDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDLLOZp-9G4fm-GqPn8JJ2DtLTXca-C5BY",

    authDomain:
        "engineeringstudieseoi.firebaseapp.com",

    projectId:
        "engineeringstudieseoi",

    storageBucket:
        "engineeringstudieseoi.firebasestorage.app",

    messagingSenderId:
        "692995755223",

    appId:
        "1:692995755223:web:ab00efbc1c3d6f2e74f492"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


const status =
    document.getElementById("status");

const homeLink =
    document.getElementById("homeLink");


function showStatus(
    message,
    type
) {

    status.textContent =
        message;

    status.className =
        "status " + type;

}


async function verifyEmail() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const mode =
        params.get("mode");

    const actionCode =
        params.get("oobCode");


    if (
        mode !== "verifyEmail" ||
        !actionCode
    ) {

        showStatus(
            "This verification link is invalid or incomplete.",
            "error"
        );

        homeLink.style.display =
            "inline-block";

        return;
    }


    try {

        /*
           Apply Firebase's official verification code.
        */

        await applyActionCode(
            auth,
            actionCode
        );


        /*
           Check whether the applicant's Firebase account
           is currently signed in.
        */

        const user =
            auth.currentUser;


        if (!user) {

            showStatus(
                "Your email has been verified by Firebase, but this browser does not have your application session available. Please return to the website using the same browser you used to apply.",
                "error"
            );

            homeLink.style.display =
                "inline-block";

            return;
        }


        await reload(user);


        /*
           Find this user's applicant document.
        */

        const q =
            query(
                collection(db, "applicants"),
                where(
                    "uid",
                    "==",
                    user.uid
                )
            );


        const snapshot =
            await getDocs(q);


        if (snapshot.empty) {

            showStatus(
                "Your email was verified, but your application could not be found.",
                "error"
            );

            homeLink.style.display =
                "inline-block";

            return;
        }


        /*
           Update the applicant record.
        */

        for (
            const applicant of snapshot.docs
        ) {

            await updateDoc(
                applicant.ref,
                {
                    verified: true
                }
            );

        }


        showStatus(
            "Email verified successfully! Your expression of interest is now confirmed.",
            "success"
        );


        homeLink.style.display =
            "inline-block";


    } catch (error) {

        console.error(
            "VERIFICATION ERROR:",
            error
        );


        let message =
            "We couldn't verify this email address.";


        if (
            error.code ===
            "auth/invalid-action-code"
        ) {

            message =
                "This verification link is invalid, expired, or has already been used.";

        }


        if (
            error.code ===
            "auth/expired-action-code"
        ) {

            message =
                "This verification link has expired. Please request a new verification email.";

        }


        showStatus(
            message,
            "error"
        );


        homeLink.style.display =
            "inline-block";

    }

}


verifyEmail();

</script>

</body>
</html>
